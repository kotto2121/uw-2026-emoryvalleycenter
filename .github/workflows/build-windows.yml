# Builds the Windows app (portable .exe + installer) on a real Windows runner
# and attaches them to the run as a downloadable artifact.
#
# Download: GitHub → Actions → "Build Windows app" → latest run → Artifacts.
# Re-run any time from the Actions tab ("Run workflow").
name: Build Windows app

on:
  push:
    branches: ["main", "claude/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build UI (Next.js static export)
        run: npx next build app

      - name: Package Windows app (unsigned)
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Checksums
        shell: pwsh
        run: Get-FileHash release\*.exe -Algorithm SHA256 | Format-Table -AutoSize | Out-String -Width 300 | Tee-Object release\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Greenhouse-Windows
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          retention-days: 30
          compression-level: 0
