# Builds the Windows app (portable .exe + installer) on a real Windows runner
# and attaches them to the run as a downloadable artifact.
#
# Download: GitHub → Actions → "Build Windows app" → latest run → Artifacts.
# Re-run any time from the Actions tab ("Run workflow").
name: Build Windows app

on:
  push:
    branches: ["main", "claude/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build UI, bundle main process, package Windows app (unsigned)
        run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Smoke test — launch the packaged .exe on Windows
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP "smoke.json"
          $env:EVC_SMOKE_TEST = $result
          $exe = Get-ChildItem "release\win-unpacked\*.exe" | Where-Object { $_.Name -notmatch "elevate|Uninstall" } | Select-Object -First 1
          Write-Host "Launching $($exe.FullName)"
          $p = Start-Process -FilePath $exe.FullName -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "App did not finish the self-test within 120s" }
          if (-not (Test-Path $result)) { throw "App exited (code $($p.ExitCode)) without writing a self-test result" }
          Get-Content $result
          $json = Get-Content $result -Raw | ConvertFrom-Json
          if (-not $json.ok) { throw "Self-test failed" }

      - name: Checksums
        shell: pwsh
        run: Get-FileHash release\*.exe -Algorithm SHA256 | Format-Table -AutoSize | Out-String -Width 300 | Tee-Object release\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Greenhouse-Windows
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          retention-days: 30
          compression-level: 0
