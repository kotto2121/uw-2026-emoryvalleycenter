<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:;" />
<title>Greenhouse</title>
<style>
  /*
   * Launch animation. The mark is drawn inline so it renders instantly.
   * BRAND: replace the <svg> below with the Emory Valley Center logo (SVG)
   * and adjust --brand / --brand-2 to the official colors.
   */
  :root { --brand: #1f5c4a; --brand-2: #7cb342; --ink: #1d2b26; --muted: #6b7a73; --card: #fbfaf6; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body {
    display: grid; place-items: center;
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-app-region: drag;
  }
  .card {
    width: 420px; height: 320px; border-radius: 22px; background: var(--card);
    box-shadow: 0 24px 60px rgba(16, 40, 32, .28), 0 0 0 1px rgba(16, 40, 32, .06);
    display: grid; place-items: center; align-content: center; gap: 18px;
    animation: card-in .5s cubic-bezier(.2,.8,.2,1) both;
    position: relative; overflow: hidden;
  }
  .card::before { /* soft brand glow */
    content: ""; position: absolute; inset: -40% -20% auto; height: 70%;
    background: radial-gradient(closest-side, rgba(124,179,66,.18), transparent);
    animation: glow 2.4s ease-in-out .3s both;
  }
  svg.mark { width: 96px; height: 96px; overflow: visible; }
  .ring { fill: none; stroke: var(--brand); stroke-width: 5; stroke-linecap: round;
          stroke-dasharray: 290; stroke-dashoffset: 290; animation: draw .9s cubic-bezier(.6,.1,.2,1) .15s forwards; }
  .stem { fill: none; stroke: var(--brand); stroke-width: 5; stroke-linecap: round;
          stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw .5s ease-out .75s forwards; }
  .leaf { transform-box: fill-box; transform: scale(0); animation: sprout .55s cubic-bezier(.3,1.6,.5,1) forwards; }
  .leaf.l { fill: var(--brand-2); transform-origin: 100% 100%; animation-delay: 1.05s; }
  .leaf.r { fill: var(--brand); transform-origin: 0% 100%; animation-delay: 1.2s; }
  .title { text-align: center; opacity: 0; transform: translateY(8px); animation: rise .6s ease-out 1.25s forwards; }
  .title h1 { font-size: 26px; font-weight: 650; letter-spacing: -.01em; color: var(--ink); }
  .title p { font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
  .dots { display: flex; gap: 6px; opacity: 0; animation: fade .4s ease 1.6s forwards; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); opacity: .25; animation: pulse 1.1s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  body.out .card { animation: card-out .35s ease-in forwards; }

  @keyframes card-in { from { opacity: 0; transform: scale(.94) translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes card-out { to { opacity: 0; transform: scale(1.03); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes sprout { to { transform: scale(1); } }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @keyframes fade { to { opacity: 1; } }
  @keyframes glow { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 50% { opacity: 1; transform: translateY(-2px); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation-duration: .01s !important; animation-delay: 0s !important; }
  }
</style>
</head>
<body>
  <div class="card" role="img" aria-label="Greenhouse by Emory Valley Center is starting">
    <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
      <circle class="ring" cx="50" cy="50" r="45" transform="rotate(-90 50 50)" />
      <path class="stem" d="M50 78 V44" />
      <path class="leaf l" d="M49 52 C36 52 26 44 25 30 C38 30 48 38 49 52 Z" />
      <path class="leaf r" d="M51 46 C52 31 62 22 77 22 C76 37 66 46 51 46 Z" />
    </svg>
    <div class="title">
      <h1>Greenhouse</h1>
      <p>Emory Valley Center</p>
    </div>
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>
</body>
</html>
