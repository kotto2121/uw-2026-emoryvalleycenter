  category: architecture
  content: "The XLSX import pipeline uses a three-tier confidence model
    (full/partial/none) based on alias hit counts to determine UI flow: full
    auto-maps, partial shows column mapping with required-field gates, and none
    presents a click-to-orient preview grid. This replaces hard 422 errors for
    unrecognized schemas."
  tags:
