  content: "The Windows build pipeline is: npm run dist:win triggers next build →
    esbuild bundles main process to dist/main.js + sql-wasm.wasm →
    electron-builder produces NSIS installer and portable exe in release/. The
    sql-wasm.wasm file must be asarUnpack'd since it cannot load from inside the
    asar archive."
